<svg viewBox="0 0 340 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#16222A"/>
    </linearGradient>
  </defs>

  <!-- Phone body -->
  <rect x="20" y="10" width="300" height="460" rx="36" fill="url(#phoneBody)" stroke="#00C6FF" stroke-width="2" opacity="0.95"/>
  <!-- Screen -->
  <rect x="36" y="46" width="268" height="392" rx="20" fill="url(#screenBg)"/>
  <!-- Notch -->
  <rect x="140" y="22" width="60" height="10" rx="5" fill="#000000" opacity="0.6"/>

  <!-- Header -->
  <text x="170" y="82" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="bold">📡 WiFi Track</text>

  <!-- Radiating WiFi arcs -->
  <g transform="translate(170,150)">
    <circle r="9" fill="#00C6FF"/>
    <path d="M -28 8 A 38 38 0 0 1 28 8" stroke="#00C6FF" stroke-width="4" fill="none" opacity="0" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M -46 16 A 62 62 0 0 1 46 16" stroke="#00C6FF" stroke-width="4" fill="none" opacity="0" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.45s" repeatCount="indefinite"/>
    </path>
    <path d="M -64 24 A 86 86 0 0 1 64 24" stroke="#00C6FF" stroke-width="4" fill="none" opacity="0" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Status card -->
  <rect x="56" y="220" width="228" height="66" rx="14" fill="#132530" stroke="#1e7e34" stroke-width="1.5"/>
  <circle cx="80" cy="253" r="7" fill="#2ecc71">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="98" y="248" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">PRESENT</text>
  <text x="98" y="266" fill="#8fa3ad" font-family="Arial, sans-serif" font-size="11">Verified · Trusted Router</text>

  <!-- Live signal bars -->
  <g transform="translate(238,232)">
    <rect x="0" y="26" width="7" height="12" rx="1.5" fill="#00C6FF"/>
    <rect x="12" y="18" width="7" height="20" rx="1.5" fill="#00C6FF">
      <animate attributeName="height" values="20;28;20" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="18;10;18" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="8" width="7" height="30" rx="1.5" fill="#00C6FF">
      <animate attributeName="height" values="30;38;30" dur="1.6s" begin="0.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;0;8" dur="1.6s" begin="0.25s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Animated break/session timer ring -->
  <g transform="translate(170,345)">
    <circle r="36" fill="none" stroke="#233240" stroke-width="7"/>
    <circle r="36" fill="none" stroke="#FFB020" stroke-width="7" stroke-dasharray="226" stroke-dashoffset="226" stroke-linecap="round" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="226;40;226" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">7h 32m</text>
  </g>
  <text x="170" y="404" text-anchor="middle" fill="#8fa3ad" font-family="Arial, sans-serif" font-size="11">Connected duration today</text>

  <!-- Footer tagline -->
  <text x="170" y="432" text-anchor="middle" fill="#00C6FF" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5">ATTENDANCE. AUTOMATED.</text>
</svg>